name: Build Band Creator APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Cordova (Latest Stable)
        run: npm install -g cordova

      - name: Build Cordova Project Structure
        run: |
          cordova create cordova-project com.numberblocks.bandcreator "Band Creator"
          cd cordova-project
          cordova platform add android
          rm -rf www/*
          cp -r ../src/* www/

      - name: Compile Application Package
        run: |
          cd cordova-project
          cordova build android --debug

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v5
        with:
          name: Band-Creator-APK
          path: cordova-project/platforms/android/app/build/outputs/apk/debug/Band-Creator.apk
